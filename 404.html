<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden | zeigdich.</title>
  <meta name="robots" content="noindex,follow">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>:root{--bg:#0b0b0d;--text:#f6f6f3;--muted:#b8b8b4;--line:rgba(255,255,255,.12);--accent:#ff7a1a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 10%,rgba(255,122,26,.18),transparent 30rem),var(--bg)}main{width:min(100%,720px);padding:48px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.05);text-align:center}.code{margin:0;color:#ff9a4d;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1;margin:12px 0 20px;letter-spacing:-.05em}p{color:var(--muted);font-size:1.1rem}.btn{display:inline-flex;margin-top:24px;min-height:50px;align-items:center;padding:0 22px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#ffad67);color:#1b0d03;font-weight:800;text-decoration:none}.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}</style>
</head>
<body><main><p class="code">Fehler 404</p><h1>Diese Seite gibt es nicht.</h1><p>Vielleicht wurde der Link geändert oder die Adresse ist nicht vollständig.</p><a class="btn" href="/">Zur Startseite</a></main></body>
